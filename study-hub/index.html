<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Hub · All your study apps in one place</title>
  <meta name="description" content="A gateway to every published study app, organized by subject: biology and history." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <header class="hero">
    <div class="hero-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/>
      </svg>
      <span>Study Hub</span>
    </div>
    <h1>All your study apps,<br /><span class="accent">one place to start.</span></h1>
    <p class="hero-sub">Pick a subject, choose an app, and get practicing. Every app has lessons, flashcards and quizzes.</p>

    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="search" type="search" placeholder="Search apps and topics…" autocomplete="off" />
      </div>
      <div class="chips" id="chips" role="tablist" aria-label="Filter by subject"></div>
    </div>
  </header>

  <main id="catalog" class="catalog"></main>

  <p id="empty" class="empty" hidden>No apps match your search. Try a different word.</p>

  <footer class="footer">
    <span id="footer-count"></span>
  </footer>

  <script src="apps.js"></script>
  <script src="main.js"></script>
</body>
</html>
